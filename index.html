<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="写真家・日々のポートフォリオ。ストリートフォトを、自分のペースで。">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#eeede8">
    <title>日々 — Photography</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">作品へ移動</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="日々・最初の作品へ">
          <span class="wordmark-name">日々<span class="wordmark-dot">.</span></span>
          <span class="wordmark-sub">PHOTOGRAPHY</span>
        </a>
        <p class="header-description">Street Photographer</p>
        <nav class="header-nav" aria-label="メインメニュー">
          <button class="nav-button" id="index-toggle" aria-controls="index-view" aria-expanded="false">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M1 1h5v5H1zM10 1h5v5h-5zM1 10h5v5H1zM10 10h5v5h-5z" fill="none" stroke="currentColor"/></svg>
            <span id="index-toggle-label">作品一覧</span>
          </button>
          <button class="nav-button" id="about-open">作家について<span class="nav-plus" aria-hidden="true">＋</span></button>
        </nav>
      </header>

      <main id="main" tabindex="-1">
        <section class="work-view" id="work-view" aria-label="作品の鑑賞">
          <h1 class="visually-hidden">日々の写真</h1>
          <div class="stage">
            <p class="stage-label" aria-hidden="true">SELECTED PHOTOGRAPHS</p>
            <figure class="photo-figure">
              <button class="photo-button" id="photo-open" aria-label="写真を大きく見る" aria-haspopup="dialog">
                <img id="main-photo" src="assets/photos/reference/hibi-2025-03.jpg" width="2200" height="1466" alt="樹木に囲まれた通路の先、光の当たる建物の前を歩く一人の人物。" fetchpriority="high" decoding="async">
              </button>
              <figcaption id="photo-caption" hidden></figcaption>
            </figure>
            <p class="photo-error" id="photo-error" role="status" hidden>写真を読み込めませんでした。<button id="photo-retry" class="text-link">再読み込み</button></p>
          </div>
          <div class="work-controls">
            <button class="text-button expand-button" id="expand-open" aria-haspopup="dialog">
              <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg>
              <span>大きく見る</span>
            </button>
            <div class="sequence" aria-label="写真の切り替え">
              <button class="arrow-button" id="previous" aria-label="前の写真"><svg viewBox="0 0 32 16" aria-hidden="true"><path d="M31 8H2m6-6L2 8l6 6"/></svg></button>
              <p class="counter"><span id="current-number">01</span><span class="counter-rule" aria-hidden="true"></span><span id="total-number">05</span></p>
              <button class="arrow-button" id="next" aria-label="次の写真"><svg viewBox="0 0 32 16" aria-hidden="true"><path d="M1 8h29m-6-6 6 6-6 6"/></svg></button>
            </div>
            <span class="controls-note" aria-hidden="true">PHOTOGRAPHS BY 日々</span>
          </div>
          <p class="visually-hidden" id="selection-status" role="status" aria-live="polite" aria-atomic="true"></p>
        </section>

        <section class="index-view" id="index-view" aria-labelledby="index-title" hidden>
          <div class="index-heading"><h1 id="index-title">作品一覧<span>Index</span></h1><p id="index-count">05 PHOTOGRAPHS</p></div>
          <div class="index-grid" id="index-grid"></div>
        </section>
      </main>

      <footer class="site-footer">
        <span>© <span id="copyright-year">2026</span> <span id="copyright-name">日々</span></span>
        <a href="https://www.instagram.com/hibigraph116/" target="_blank" rel="noopener noreferrer">Instagram <span aria-hidden="true">↗</span><span class="visually-hidden">（新しいタブで開く）</span></a>
      </footer>
    </div>

    <dialog id="about-dialog" class="about-dialog" aria-labelledby="about-title">
      <div class="about-inner">
        <div class="dialog-heading"><p class="eyebrow">ABOUT THE PHOTOGRAPHER</p><button class="close-button" data-close="about-dialog" aria-label="作家紹介を閉じる">閉じる <span aria-hidden="true">×</span></button></div>
        <h2 id="about-title">日々<span>Street Photographer</span></h2>
        <p class="about-statement" id="artist-statement" hidden></p>
        <a class="about-instagram" href="https://www.instagram.com/hibigraph116/" target="_blank" rel="noopener noreferrer"><span>Instagram</span><span>@hibigraph116 ↗</span><span class="visually-hidden">（新しいタブで開く）</span></a>
      </div>
    </dialog>

    <dialog id="lightbox" class="lightbox" aria-label="写真の拡大表示">
      <div class="lightbox-header"><span id="lightbox-artist">日々</span><p id="lightbox-count">01 / 05</p><button class="close-button" data-close="lightbox" aria-label="拡大表示を閉じる">閉じる <span aria-hidden="true">×</span></button></div>
      <div class="lightbox-stage" id="lightbox-stage" role="region" aria-label="写真の細部。拡大中は矢印キーで移動できます" tabindex="-1"><img id="lightbox-photo" alt=""></div>
      <div class="lightbox-footer"><button class="text-button" id="zoom-toggle" aria-pressed="false">細部を見る <span aria-hidden="true">＋</span></button><p class="zoom-note" id="zoom-note">写真全体を表示</p></div>
    </dialog>
    <noscript><p class="noscript-notice">作品の切り替えにはJavaScriptを有効にしてください。最初の写真はそのままご覧いただけます。</p></noscript>
  </body>
</html>
